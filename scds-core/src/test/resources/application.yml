# ============================================================================
# scds-core 集成测试配置
#
# 仓储层用集成测试而非 mock：SQL、CHECK 约束、生成列、分页语义只有打到真实
# MySQL 上才算验证过。目标库是本机 Docker 容器（compose.yaml），与开发库同源。
#
# 凭据来自仓库根目录的 .env（已被 .gitignore 排除）。测试工作目录是 scds-core/，
# 故同时挂 ./ 与 ../ 两个路径，从模块目录或仓库根跑都能解析到。
#
# 每个测试类加 @Transactional，用例结束回滚，不向开发库留数据。
# ============================================================================

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${SCDS_JDBC_URL:jdbc:mysql://127.0.0.1:13306/scds_next}
    username: ${SCDS_MYSQL_USER:scds_app}
    password: ${SCDS_MYSQL_PASSWORD}
    hikari:
      pool-name: scds-core-it
      maximum-pool-size: 4
      data-source-properties:
        connectionTimeZone: SERVER

  flyway:
    enabled: true
    locations: classpath:db/migration

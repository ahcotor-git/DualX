# ============================================================================
# scds-next 基础配置
# 端口为硬约束，任何改动都属于事故级变更。
#
# 本机开发环境的连接方式（与 E:\ZAA 完全一致，不多引一个依赖、不多装一个服务）：
#   数据库不是新装的 MySQL，而是复用本机已在跑的 Docker 容器 zaa-local-mysql-1
#   （mysql:8.4，监听 127.0.0.1:3306），在其中单独建 scds_next 库与 scds_app 账号。
#   凭据一律走 .env（已 gitignore），由 application-local.yml 导入，不写进本文件。
# ============================================================================
server:
  port: 11001

spring:
  application:
    name: scds-next
  profiles:
    # 部署形态由 deployment-mode 驱动：CLOUD（云管多租户）/ PRIVATE（私有化单机）
    # 本机开发时用命令行覆盖：--spring.profiles.active=local
    active: ${SCDS_DEPLOYMENT_MODE:private}
  mvc:
    problemdetails:
      enabled: true

  # ===== 存续层 =====
  # 刻意不用 ORM：整套 schema 由 Flyway 显式管理，读写走 JdbcClient。
  # connectionTimeZone: SERVER 表示「驱动不做时区换算，原样收发」——这是全库
  # 统一存 UTC 的前提（见 V1 文件头第 2 条），缺了它驱动会按 JVM 时区平移时间。
  datasource:
    url: ${SCDS_JDBC_URL:jdbc:mysql://127.0.0.1:13306/scds_next}
    username: ${SCDS_MYSQL_USER:scds_app}
    password: ${SCDS_MYSQL_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: SERVER
  flyway:
    enabled: true
    locations: classpath:db/migration

scds:
  # CLOUD | PRIVATE —— 全系统唯一的形态开关，禁止在代码里散落分支判断
  deployment-mode: ${SCDS_DEPLOYMENT_MODE:private}

  # ===== 协议 A：马甲串口链路 =====
  serial:
    port-name: COM7
    baud-rate: 115200
    flow-control-rts-cts: false
    polling-interval-ms: 200
    polling-timeout-ms: 200

  # ===== 协议 B：UWB =====
  uwb:
    data-source: TCP_SERVER          # SERIAL | TCP_SERVER
    tcp-server-host: 0.0.0.0
    tcp-server-port: 12001
    tcp-read-timeout-ms: 20000
    tcp-idle-warn-min: 3
    # UWB 连续坐标生效后，旧的 ff06 室内点位帧必须被丢弃
    uwb-mode: enabled

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

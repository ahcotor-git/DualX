# ============================================================================
# exercise —— 想定（plan）/ 编成（roster）/ 当前演习（current）
#
# 并发模型（已确认）：**边缘同一时刻只允许一场演习进行中**。
# 因此「进行中的演习」被建模为单例资源 `/api/v1/exercise/current`，
# 历史场次一律走 replay 域，不在本域暴露 /{exerciseId}。
# ============================================================================

plans:
  get:
    tags: [exercise]
    operationId: listPlans
    summary: 想定列表
    parameters:
      - name: keyword
        in: query
        description: 按名称模糊搜索
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 20
    responses:
      '200':
        description: 分页结果
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/PlanPage'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  post:
    tags: [exercise]
    operationId: createPlan
    summary: 新建想定
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/PlanUpsertRequest'
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Plan'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

planById:
  get:
    tags: [exercise]
    operationId: getPlan
    summary: 想定详情
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 想定
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Plan'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  put:
    tags: [exercise]
    operationId: updatePlan
    summary: 修改想定
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/PlanUpsertRequest'
    responses:
      '200':
        description: 已更新
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Plan'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '409':
        description: 该想定正在演习中，禁止修改
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  delete:
    tags: [exercise]
    operationId: deletePlan
    summary: 删除想定
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: 已删除
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '409':
        description: 该想定正在演习中，禁止删除
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

planRoster:
  get:
    tags: [exercise]
    operationId: getRoster
    summary: 获取想定编成
    description: 返回参演人员与其队伍/HP/弹药配置。`vestNum` 引用设备台账。
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 编成
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Roster'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  put:
    tags: [exercise]
    operationId: replaceRoster
    summary: 整体替换想定编成
    description: |
      全量替换语义（幂等）。服务端校验：编号必须存在于设备台账；同编号不得重复；
      同编号不得跨队。任一不满足返回 400 + `VALIDATION_FAILED`，不产生部分写入。
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/Roster'
    responses:
      '200':
        description: 替换后的编成
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Roster'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '409':
        description: 该想定正在演习中，禁止修改编成
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

planTemplate:
  get:
    tags: [exercise]
    operationId: downloadPlanTemplate
    summary: 下载想定导入模板
    description: 替代旧系统 `/download/shootingTemplate`。返回 xlsx 二进制。
    parameters:
      - name: format
        in: query
        schema:
          type: string
          enum: [XLSX, CSV]
          default: XLSX
    responses:
      '200':
        description: 模板文件
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          text/csv:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

planImport:
  post:
    tags: [exercise]
    operationId: importPlan
    summary: 从模板文件导入想定
    description: 上传模板文件，成功即返回创建好的想定（含编成）。整文件校验通过才落库。
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              name:
                type: string
                description: 不传则取文件名
    responses:
      '201':
        description: 导入成功
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Plan'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

exerciseCurrent:
  get:
    tags: [exercise]
    operationId: getCurrentExercise
    summary: 当前演习状态
    description: 无演习进行中时返回 `running=false`（HTTP 200，不是 404）。
    responses:
      '200':
        description: 当前演习
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Exercise'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  post:
    tags: [exercise]
    operationId: startExercise
    summary: 开始演习
    description: |
      以单例资源语义创建「进行中的演习」。服务端顺序执行：
      ① 加载想定编成；② 逐台下发 14B 轮询配置帧；③ 下发 7B 演习开始帧；④ 进入态势推送。
      任一步失败即整体回滚并返回 409/500，绝不留下半启动状态。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/StartExerciseRequest'
    responses:
      '201':
        description: 演习已开始
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/Exercise'
      '400':
        description: 编成为空或含未登记马甲（`EXERCISE_ROSTER_EMPTY` / `VALIDATION_FAILED`）
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '409':
        description: 已有演习进行中（`EXERCISE_ALREADY_RUNNING`），或马甲串口链路未开启导致无法下发配置
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

  delete:
    tags: [exercise]
    operationId: stopExercise
    summary: 结束演习
    description: |
      下发 7B 演习结束帧，冻结态势，并把本场落库为一条 replay（含轨迹、命中、统计）。
      落库失败不影响停演本身（返回 200 但 replayId 为 null，并记 WARN 日志）。
    responses:
      '200':
        description: 停演结果
        content:
          application/json:
            schema:
              type: object
              properties:
                exerciseId:
                  type: string
                endedAt:
                  type: string
                  format: date-time
                replayId:
                  type: [string, 'null']
                  description: 复盘记录 ID，可用于立即跳转复盘
                endReason:
                  type: string
                  enum: [NORMAL, CRASH_RECOVERED]
                  description: |
                    本场结束原因。走本端点停演恒为 `NORMAL`；`CRASH_RECOVERED` 只会出现在
                    启动自愈补写的场次里（其终止时刻是进程重启后的发现时刻）。
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '403':
        $ref: '../schemas/common.yaml#/Forbidden'
      '409':
        description: 当前没有演习进行中（`EXERCISE_NOT_RUNNING`）
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

exerciseCurrentLogs:
  get:
    tags: [exercise]
    operationId: listCurrentExerciseLogs
    summary: 当前演习日志流水（指挥台滚动日志）
    description: 按 seq 增量拉取。seq 单调递增，客户端保存最后一条的 seq 作为下次的 sinceSeq。
    parameters:
      - name: sinceSeq
        in: query
        description: 只返回 seq 大于该值的条目；不传则返回最新一页
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 100
    responses:
      '200':
        description: 日志条目
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../schemas/situation.yaml#/ExerciseLogEntry'
                latestSeq:
                  type: integer
                  format: int64
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

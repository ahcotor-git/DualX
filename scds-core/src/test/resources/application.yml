# ============================================================================
# scds-core 集成测试配置
#
# 仓储层用集成测试而非 mock：SQL、CHECK 约束、生成列、分页语义只有打到真实
# MySQL 上才算验证过。独立测试库与开发库共用本机容器，不共用账号或凭据。
#
# 凭据来自仓库根目录的 .env.test（已被 .gitignore 排除）。测试工作目录是 scds-core/，
# 故同时挂 ./ 与 ../ 两个路径，从模块目录或仓库根跑都能解析到。
#
# 多数仓储测试回滚；AuthServiceIT真实提交后按自身UUID清理。禁止连开发/生产库。
# ============================================================================

spring:
  config:
    import:
      - optional:file:.env.test[.properties]
      - optional:file:../.env.test[.properties]

  datasource:
    url: ${SCDS_TEST_JDBC_URL:jdbc:mysql://127.0.0.1:13306/scds_next_test?rewriteBatchedStatements=true}
    username: ${SCDS_TEST_MYSQL_USER:scds_test}
    password: ${SCDS_TEST_MYSQL_PASSWORD}
    hikari:
      pool-name: scds-core-it
      maximum-pool-size: 4
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    out-of-order: false

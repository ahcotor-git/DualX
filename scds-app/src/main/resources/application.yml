# ============================================================================
# scds-next 基础配置
# 端口为硬约束，任何改动都属于事故级变更。
#
# 本机开发环境的数据来源（完整理由见 compose.yaml）：
#   本项目自带容器 scds-local-mysql（mysql:8.4，监听 127.0.0.1:13306），库 scds_next、
#   账号 scds_app；镜像版本与 healthcheck 与 E:\ZAA 保持一致，仅数据目录独立。
#   刻意不复用 zaa-local-mysql-1：其 root 口令已与 .env 记录不符，重置会中断 ZAA 运行。
#   凭据一律走 .env（已 gitignore），由 application-local.yml 导入，不写进本文件。
# ============================================================================
server:
  port: 11001
  # 公网入口由Nginx/FRP转发；未建立可信代理链前不信任客户端转发头。
  forward-headers-strategy: none
  # 停机必须优雅：串口链路要在进程退出前释放，UWB 接收缓冲要在退出前 flush。
  # 直接强杀会让下一次启动抢不到 COM 口（Windows 上尤其明显）。
  shutdown: graceful

spring:
  application:
    name: scds-next
  lifecycle:
    # 单次停机的最长等待；超时即强杀，避免"关不掉"卡住现场收场。
    timeout-per-shutdown-phase: 20s
  profiles:
    # ⚠ 这里只表达「运行环境」这一个维度（local / 现场部署 profile）。
    #   全部业务现在本地部署，云端仅Nginx/FRPS；FRPC不由profile推导。
    #   deployment-mode只保留历史兼容登记，不代表存在云端业务进程。
    #
    # 刻意不给默认值：默认值若是 local，会连带把 server.address 锁到 127.0.0.1，
    # 生产上漏配就等于 11001 无法从外部访问——这种"静默默认"比漏配直接报错危险得多。
    # 本机开发显式指定：--spring.profiles.active=local（或设 SCDS_PROFILE=local）
    active: ${SCDS_PROFILE:}
  mvc:
    problemdetails:
      enabled: true

  # ===== 底图上传上限 =====
  # 与 scds.files.max-image-bytes 是一对，改一处必须同步另一处：
  # 容器层超限会在进控制器之前就被拒（拿不到 Problem 体），两处不一致会让
  # 「文件过大」以两种不同形态出现，排查时更难定位。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # ===== JSON 契约 =====
  # 契约承诺「时间一律 RFC 3339、服务端只发 UTC」。下面三项在 Boot 里本就是默认值，
  # 但默认值不等于契约——显式钉死，避免升版本或引依赖时被静默改形。
  # adjust-dates-to-context-time-zone=false 与 connectionTimeZone=SERVER 是一对：
  # 缺了它，驱动会按 JVM 时区平移 java.time 类型，「全库 UTC」的前提即被破坏。
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    time-zone: UTC

  # ===== 存续层 =====
  # 刻意不用 ORM：整套 schema 由 Flyway 显式管理，读写走 JdbcClient。
  # connectionTimeZone: SERVER 表示「驱动不做时区换算，原样收发」——这是全库
  # 统一存 UTC 的前提（见 V1 文件头第 2 条），缺了它驱动会按 JVM 时区平移时间。
  datasource:
    # rewriteBatchedStatements=true：缺了它 Connector/J 不会把 batch 改写成多值 INSERT，
    # 每行仍各走一次往返，t_track_sample 的「真批量」写入等于白做。
    # 该改写不影响自增主键——轨迹批量写入不取 generated keys。
    url: ${SCDS_JDBC_URL:jdbc:mysql://127.0.0.1:13306/scds_next?rewriteBatchedStatements=true}
    username: ${SCDS_MYSQL_USER:scds_app}
    password: ${SCDS_MYSQL_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: SERVER
  flyway:
    enabled: true
    locations: classpath:db/migration

scds:
  # 历史兼容登记，当前无消费者。业务只部署本地，不再计划CLOUD业务节点。
  # 账号/设备统一由本地签发；是否开启可选FRPC不由此字段或profile推导。
  deployment-mode: ${SCDS_DEPLOYMENT_MODE:PRIVATE}

  # ===== 本地鉴权（最新部署边界见 docs/architecture.md 第0节）=====
  # 两条铁律：
  #   1. 验签只用本地公钥，**启动过程绝不联网**——因此禁用 Boot 的
  #      spring.security.oauth2.resourceserver.jwt.* 自动装配（issuer-uri 形态会在
  #      启动期做一次 OIDC 发现，现场无外网表现为「服务起不来」）。
  #   2. 现场实例显式启用本地签发；false仅保留受控测试/工具用途。
  auth:
    jwt:
      issuer: ${SCDS_JWT_ISSUER:scds-edge}
      # 本地统一签发账号access/refresh和deviceToken。现场业务应为true。
      # false保留测试/工具用途；当前控制器尚未接线，不宣称已实现关闭能力的404。
      signing-enabled: ${SCDS_JWT_SIGNING:true}
      # 验签公钥：内联 PEM 或文件二选一。内联形态在 .env/.properties 里要把换行写成 \n，
      # 现场更推荐用 public-key-file，省掉转义与「换行被吃掉」这类难查问题。
      public-key: ${SCDS_JWT_PUBLIC_KEY:}
      public-key-file: ${SCDS_JWT_PUBLIC_KEY_FILE:}
      # 签名私钥：仅 signing-enabled=true 时需要。**绝不内置默认私钥**——那等于所有客户共用一把钥匙。
      private-key: ${SCDS_JWT_PRIVATE_KEY:}
      private-key-file: ${SCDS_JWT_PRIVATE_KEY_FILE:}
      # 历史配置键，必须为空；非空在AuthJwtProperties绑定时失败，不访问远端。
      jwks-uri: ${SCDS_JWKS_URI:}
      jwks-refresh-ms: 3600000
      # 有效期三档：access 覆盖一次指挥台作业，refresh 覆盖一次集训周期，
      # device从签发起有效12小时，不按日历午夜截断；会话SID另行校验。
      access-token-ttl: 30m
      refresh-token-ttl: 14d
      device-token-ttl: 12h

  # ===== 初始管理员（仅首次启动建号）=====
  # 迁移文件刻意不种任何账号：写死口令等于所有客户共用一把钥匙，写死散列则无法换口令。
  # 这里由部署侧提供口令明文，应用在启动时用 BCrypt 落成散列，**建号成功后建议从 .env
  # 删掉 SCDS_ADMIN_PASSWORD**——此后进程不再读它，口令只以散列形式存在于库中。
  # 两项任一为空则跳过建号；云端只做代理，不下发账号，本地首次部署显式配置。
  admin:
    username: ${SCDS_ADMIN_USERNAME:}
    password: ${SCDS_ADMIN_PASSWORD:}
    display-name: ${SCDS_ADMIN_DISPLAY_NAME:}

  # ===== 底图文件存储与签名 URL（D09）=====
  # 根目录留空则用 ${user.home}/.scds/files（沿用旧系统 .scds 约定）。
  # 签名密钥留空则本次启动随机生成并打 WARN；显式配置短于 32 字符直接启动失败。
  # max-image-bytes 用字节数（不写 20MB，避免 Long 绑定解析不到 DataSize）。
  files:
    root: ${SCDS_FILES_ROOT:}
    sign-secret: ${SCDS_FILE_SIGN_SECRET:}
    sign-ttl: 15m
    max-image-bytes: 20971520

  # ===== 协议 A：马甲串口链路 =====
  serial:
    port-name: COM7
    baud-rate: 115200
    flow-control-rts-cts: false
    polling-interval-ms: 200
    polling-timeout-ms: 200

  # ===== 协议 B：UWB =====
  uwb:
    # UWB 解算开关：关闭时 IndoorPositionResolver 不产出任何室内坐标（UWB 帧只计数）。
    mode: true
    data-source: TCP_SERVER          # SERIAL | TCP_SERVER
    tcp-server-host: 0.0.0.0
    tcp-server-port: 12001
    tcp-read-timeout-ms: 20000
    tcp-idle-warn-min: 3
    # 注：UWB 连续坐标生效后，旧的 ff06 室内点位帧必须被丢弃（协议 §1.4④）；
    # 该丢弃开关属标定分段，尚未接线，当前 ff06 只记 DEBUG。

  # ===== 硬件链路网关（设计 05 §4.6，D10 口径）=====
  # simulator 仅供开发与自动测试（进程内注入帧、不占串口、不监听 12001）；
  # **生产必须显式 real**，仿真通过不得写成现场通过。
  gateway:
    mode: real
    # 按 t_link_config.enabled 在启动时自动开链路；与 HTTP 手动开链路并存。
    # 目前无消费者（随配置接口/LIFE 段落地），保持 false。
    auto-open-on-startup: false
    serial:
      # 沿用旧系统发送队列上限，**不是生产容量结论**；配置 <1 直接启动失败。
      send-queue-capacity: 10
      # REJECT：队列满即把失败返回调用方（判死/判活/充弹丢一条就是现场事故）。
      # 另一选项 DROP_LOW_PRIORITY（丢轮询/状态类低优先帧）；默认取哪个待现场操作口径确认。
      send-queue-overflow: REJECT
    uwb:
      # 容量候选值，**尚未接入** Netty 启动参数（它仍用固定的 4 / Netty 默认线程数），
      # 待 D10 容量验证后再接，避免把未验证值写进启动路径。
      tcp-backlog: 4
      worker-threads: 0

  # ===== 态势状态机（设计 06 §4.7，D10 口径）=====
  # 处理模型：有界队列 + 1 个写手平台线程（不引入虚拟线程——D10 要求线程选型先实测）。
  # ⚠ 下表数值是**设计候选**，不是容量结论。现场人数/基站/客户端/帧率/SLA 与 RPO/RTO 数据到位前，
  #   不得据其宣称容量达标；判据也不看配置值，只看 StateEventQueue 的丢弃/拒收计数。
  state:
    # 事件队列容量。容量 <=0 直接启动失败。
    event-queue-capacity: 1024
    # REJECT：队列满即拒收并计数。丢一条心跳只影响一拍在线窗口，丢一条命中/阵亡是现场事故，
    # 故不与用户手里的"发送队列"共用 DROP_LOW_PRIORITY 取舍（另一选项保留未启用）。
    event-queue-overflow: REJECT
    # 在线扫描周期，必须严格小于 5000ms 在线窗口（否则离线跳变必然晚于窗口本身），绑定期校验。
    offline-scan-interval-ms: 1000
    # 定时采样周期与位移阈值：室内阈值作用于 GeoPoint.xPct/yPct 的归一化平面距离（0~1），
    # 室外阈值作用于 WGS-84 两点的大地距离（米）——两侧单位不同，不可互相比较。
    sample-interval-ms: 1000
    sample-displacement-indoor: 0.05
    sample-displacement-outdoor: 100
    # 轨迹批量落库：够 batch-size 或过 flush-interval-ms 由写手线程一次插入；缓冲硬上限不得小于批量大小。
    track-batch-size: 500
    track-flush-interval-ms: 1000
    track-max-buffered: 1000000

  # ===== 态势增量窗口（沿用设计 02 §5 既有键，不用 scds.state.* 前缀）=====
  # 保留最近 N 条单元级变化，超出即 SITUATION_REVISION_TOO_OLD（HTTP 409，接线在 M4）。
  situation:
    revision-window: 1024

  # ===== WebSocket 推送（设计 02 §4.7 / §5）=====
  # 两条通道（态势 / 链路）的背压与保活口径；链路侧随 D07/Q9 一起接。
  push:
    # 每会话待发帧上限：队满即丢帧并计数，随后由「revision 不连续 → 改推全量」自动收敛。
    # ⚠ 候选值，不是容量结论——现场客户端数（D10/Q5）到位前不得据其宣称容量达标。
    send-queue-capacity: 256
    # 无上行主动断开阈值，契约值 30000ms（可配不可改语义）；扫描周期固定 5s。
    idle-timeout-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ===== 日志 =====
# TraceIdFilter 把 traceId 写入 MDC（键名 traceId）。Boot 默认 pattern 不含 %X{traceId}，
# 不显式加就等于「生成了追踪号却从不打印」——报障时无法把日志与 Problem.traceId 对上。
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

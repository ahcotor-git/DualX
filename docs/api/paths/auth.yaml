# ============================================================================
# auth —— 账号与设备认证
# 账号可由云侧签发 accessToken，或由具备签发能力的 PRIVATE 实例自签自验。
# refreshToken 由维护本地刷新记录的实例签发；设备令牌挂钩本地绑定与 SID。
# 离线验签要求本地公钥且 jwks-uri 为空；完整能力边界见 ../../design/03-auth.md。
# ============================================================================

authLogin:
  post:
    tags: [auth]
    operationId: login
    summary: 账号登录
    description: 发放 access/refresh 令牌。失败统一返回 `AUTH_BAD_CREDENTIALS`，不区分账号不存在与密码错误。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/LoginRequest'
    responses:
      '200':
        description: 登录成功
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/TokenPair'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '429':
        $ref: '../schemas/common.yaml#/TooManyRequests'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

authRefresh:
  post:
    tags: [auth]
    operationId: refreshToken
    summary: 刷新令牌
    description: |
      用 refreshToken 换新的 access/refresh 令牌对（滚动刷新）。
      到期返回 `AUTH_TOKEN_EXPIRED`；未知、篡改或已撤销返回 `AUTH_TOKEN_INVALID`。
      已撤销令牌重放将撤销该账号全部 refreshToken。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/RefreshRequest'
    responses:
      '200':
        description: 刷新成功
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/TokenPair'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

authLogout:
  post:
    tags: [auth]
    operationId: logout
    summary: 退出登录
    description: |
      无请求体；按账号令牌的 sub 撤销该账号全部 refreshToken（全端退出，已确认）。
      accessToken 因无状态不可撤销，由短有效期兜底。
    responses:
      '204':
        description: 已退出
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'

authMe:
  get:
    tags: [auth]
    operationId: getCurrentUser
    summary: 获取当前登录用户
    responses:
      '200':
        description: 当前用户
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/User'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'

authDeviceLogin:
  post:
    tags: [auth]
    operationId: deviceLogin
    summary: 单兵终端（马甲 App）登录
    description: |
      用「马甲编号 + 绑定密钥」换取设备令牌，替代旧系统 `/app/login`。
      服务端校验该马甲已在设备台账中登记且未被顶替；重复登录会使旧令牌失效（单端在线）。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/domain.yaml#/DeviceLoginRequest'
    responses:
      '200':
        description: 登录成功
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/DeviceTokenPair'
      '400':
        $ref: '../schemas/common.yaml#/BadRequest'
      '401':
        description: 未绑定 / 密钥错误（`AUTH_DEVICE_NOT_BOUND`）
        content:
          application/problem+json:
            schema:
              $ref: '../schemas/common.yaml#/Problem'
      '404':
        $ref: '../schemas/common.yaml#/NotFound'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'

authDeviceMe:
  get:
    tags: [auth]
    operationId: getDeviceSelf
    summary: 单兵终端获取自身信息与实时状态
    description: 替代旧系统 `/app/me`。返回自身实时态，模型与态势域完全一致，前端可复用同一套渲染。
    security:
      - deviceToken: []
    responses:
      '200':
        description: 自身信息
        content:
          application/json:
            schema:
              $ref: '../schemas/domain.yaml#/DeviceSelf'
      '401':
        $ref: '../schemas/common.yaml#/Unauthorized'
      '500':
        $ref: '../schemas/common.yaml#/InternalError'
